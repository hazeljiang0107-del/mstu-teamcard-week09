<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meet our team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="intro">
    <p class="eyebrow">A little about us &rarr;</p>
    <h1>Meet our team.</h1>
    <p class="tagline"><span id="team-count">Our</span> people, <span id="story-count">our</span> stories, one shared page.</p>
  </header>

  <main class="cards" id="team">

    <!-- ===== Hazel's card ===== -->
    <article class="card" style="--card-tint: #d9ecdf;">
      <div class="card-bar">
        <span>&#9733; our team</span>
        <span class="card-number"></span>
      </div>
      <div class="card-image">
        <img src="images/hazel.svg" alt="A laptop with a glowing lightbulb, representing building with technology">
      </div>
      <h2 class="card-name">Hazel Jiang</h2>
      <p class="card-major">Mathematics, Science &amp; Technology</p>
      <button class="fact-button" type="button" aria-expanded="false">Show fun fact</button>
      <p class="fun-fact" hidden>I love turning ideas into little web projects, and I always have way too many browser tabs open.</p>
      <ul class="card-tags">
        <li>Web design</li>
        <li>Bubble tea</li>
      </ul>
    </article>

      <p class="card-major">Your major or area of study</p>
      <button class="fact-button" type="button" aria-expanded="false">Show fun fact</button>
      <p class="fun-fact" hidden>Your fun fact goes here.</p>
      <ul class="card-tags">
        <li>Interest one</li>
        <li>Interest two</li>
      </ul>
    </article>
    -->

  </main>

  <footer class="footer">
    <p>MSTU &middot; Week 09 team page</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
